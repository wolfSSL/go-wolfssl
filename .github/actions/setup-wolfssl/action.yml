name: Setup wolfSSL
description: >-
  Build (or restore from cache) wolfSSL and install it under a prefix. A git
  ref is resolved to its commit so the cache tracks the upstream tree, and
  every build-affecting input is folded into the cache key. With
  fips-ready-version set, the public FIPS Ready bundle is built instead.

inputs:
  ref:
    description: wolfSSL git ref (branch, tag or commit). Ignored for FIPS Ready.
    required: false
    default: master
  configure-flags:
    description: wolfSSL ./configure flags.
    required: false
    default: ""
  cflags:
    description: Extra CFLAGS, passed only when non-empty so wolfSSL keeps its default optimization.
    required: false
    default: ""
  ldflags:
    description: Extra LDFLAGS, passed only when non-empty.
    required: false
    default: ""
  cc:
    description: C compiler to build wolfSSL with.
    required: false
    default: gcc
  prefix:
    description: Install prefix.
    required: true
  fips-ready-version:
    description: Build the wolfSSL FIPS Ready bundle of this version instead of a git ref.
    required: false
    default: ""
  fips-ready-sha256:
    description: Expected sha256 of the FIPS Ready zip.
    required: false
    default: ""

outputs:
  sha:
    description: The wolfSSL commit built, or fips-ready-<version>.
    value: ${{ steps.key.outputs.sha }}

runs:
  using: composite
  steps:
    - name: Resolve wolfSSL and compute the cache key
      id: key
      shell: bash
      env:
        REF: ${{ inputs.ref }}
        FLAGS: ${{ inputs.configure-flags }}
        XCFLAGS: ${{ inputs.cflags }}
        XLDFLAGS: ${{ inputs.ldflags }}
        XCC: ${{ inputs.cc }}
        PREFIX: ${{ inputs.prefix }}
        FIPS_READY: ${{ inputs.fips-ready-version }}
        FIPS_READY_SHA256: ${{ inputs.fips-ready-sha256 }}
      run: |
        set -euo pipefail
        if [ -n "$FIPS_READY" ]; then
          if [ -z "$FIPS_READY_SHA256" ]; then
            echo "::error::fips-ready-sha256 is required with fips-ready-version"
            exit 1
          fi
          SHA="fips-ready-$FIPS_READY-${FIPS_READY_SHA256:0:16}"
        else
          URL=https://github.com/wolfSSL/wolfssl.git
          # Peel annotated tags to their commit, then fall back to a branch,
          # then treat the ref as a raw commit.
          SHA=$(git ls-remote "$URL" "$REF^{}" | awk 'NR==1{print $1}')
          [ -n "$SHA" ] || SHA=$(git ls-remote "$URL" "$REF" | awk 'NR==1{print $1}')
          [ -n "$SHA" ] || SHA=$REF
        fi
        CFGHASH=$(printf '%s\037%s\037%s\037%s\037%s' "$FLAGS" "$XCFLAGS" "$XLDFLAGS" "$XCC" "$PREFIX" \
                    | sha256sum | cut -c1-16)
        echo "sha=$SHA" >> "$GITHUB_OUTPUT"
        echo "cache-key=go-wolfssl-ci-v1-wolfssl-${RUNNER_OS}-${SHA}-${CFGHASH}" >> "$GITHUB_OUTPUT"
        echo "wolfSSL ${FIPS_READY:+FIPS Ready }${FIPS_READY:-$REF} -> $SHA (cfg $CFGHASH)"

    - name: Restore the wolfSSL install
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ inputs.prefix }}
        key: ${{ steps.key.outputs.cache-key }}

    - name: Fetch wolfSSL
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        SHA: ${{ steps.key.outputs.sha }}
        FIPS_READY: ${{ inputs.fips-ready-version }}
        FIPS_READY_SHA256: ${{ inputs.fips-ready-sha256 }}
      run: |
        set -euo pipefail
        rm -rf "$RUNNER_TEMP/wolfssl-src"
        if [ -n "$FIPS_READY" ]; then
          curl -fsSL -o "$RUNNER_TEMP/fips-ready.zip" \
            "https://www.wolfssl.com/wolfssl-$FIPS_READY-gplv3-fips-ready.zip"
          echo "$FIPS_READY_SHA256  $RUNNER_TEMP/fips-ready.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/fips-ready.zip" -d "$RUNNER_TEMP/fips-ready"
          mv "$RUNNER_TEMP/fips-ready/wolfssl-$FIPS_READY-gplv3-fips-ready" "$RUNNER_TEMP/wolfssl-src"
        else
          git init -q "$RUNNER_TEMP/wolfssl-src"
          cd "$RUNNER_TEMP/wolfssl-src"
          git fetch -q --depth 1 https://github.com/wolfSSL/wolfssl.git "$SHA"
          git checkout -q --detach FETCH_HEAD
          ./autogen.sh
        fi

    - name: Build and install wolfSSL
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        FLAGS: ${{ inputs.configure-flags }}
        XCFLAGS: ${{ inputs.cflags }}
        XLDFLAGS: ${{ inputs.ldflags }}
        XCC: ${{ inputs.cc }}
        PREFIX: ${{ inputs.prefix }}
        FIPS_READY: ${{ inputs.fips-ready-version }}
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP/wolfssl-src"
        args=(--prefix="$PREFIX")
        # Flags come from .github/scripts/run-config.sh and may carry
        # CPPFLAGS=..., so split them the way a shell command line would.
        eval "args+=($FLAGS)"
        [ -z "$XCFLAGS" ] || args+=("CFLAGS=$XCFLAGS")
        [ -z "$XLDFLAGS" ] || args+=("LDFLAGS=$XLDFLAGS")
        CC="$XCC" ./configure "${args[@]}"
        make -j"$(nproc)"
        if [ -n "$FIPS_READY" ]; then
          # FIPS Ready checks its in-core hash, which changes with every build.
          ./fips-hash.sh
          make -j"$(nproc)"
        fi
        make install
