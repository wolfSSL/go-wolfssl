name: CodeQL

# START OF COMMON SECTION
on:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
# END OF COMMON SECTION

permissions:
  contents: read

jobs:
  discover:
    if: github.repository_owner == 'wolfssl'
    uses: ./.github/workflows/_resolve-wolfssl.yml

  analyze:
    name: CodeQL (Go)
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: wolfSSL configure flags
        id: flags
        run: echo "flags=$(.github/scripts/run-config.sh flags all)" >> "$GITHUB_OUTPUT"

      # Built before CodeQL starts tracing so only go-wolfssl is analyzed.
      - uses: ./.github/actions/setup-wolfssl
        with:
          ref: ${{ needs.discover.outputs.latest_stable }}
          configure-flags: ${{ steps.flags.outputs.flags }}
          prefix: /tmp/wolfssl-install

      - uses: ./.github/actions/setup-go-wolfssl

      - name: Point cgo at wolfSSL
        run: |
          ./generateOptions.sh /tmp/wolfssl-install
          echo "LD_LIBRARY_PATH=/tmp/wolfssl-install/lib" >> "$GITHUB_ENV"

      - uses: github/codeql-action/init@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          languages: go
          build-mode: manual
          queries: security-extended

      - name: Build go-wolfssl
        run: |
          go build . ./handles ./sha256 ./wolftls ./wolfx509
          grep -rl --include='*.go' '^package main' examples | while read -r f; do
            go build -o /dev/null "$f"
          done

      - uses: github/codeql-action/analyze@9f759ee644a3e7c15c1390abf49868036c00067b # v3
        with:
          category: /language:go
