name: wolfSSL Config Matrix
run-name: ${{ inputs.nightly_id && format('Nightly {0}', inputs.nightly_id) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

# START OF COMMON SECTION
on:
  workflow_call:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      nightly_id:
        description: Set by the nightly dispatcher to identify its runs
        type: string
        default: ''

# END OF COMMON SECTION

permissions:
  contents: read

defaults:
  run:
    shell: bash -e {0}

jobs:
  discover:
    if: github.repository_owner == 'wolfssl'
    uses: ./.github/workflows/_resolve-wolfssl.yml

  config:
    name: ${{ matrix.config }} (wolfSSL ${{ matrix.wolfssl-ref }})
    needs: discover
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/wolfssl/go-wolfssl-ci@sha256:243df6018d71ed9b47be8cb4c0472b1ad626b5fe583683686c72134115225003
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        config: [ all, default, opensslextra, writedup, oldtls, notls13,
                  reduced1, reduced2, certgen-noext ]
        wolfssl-ref: ${{ fromJson(needs.discover.outputs.refs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: wolfSSL configure flags
        id: flags
        env:
          CONFIG: ${{ matrix.config }}
        run: echo "flags=$(.github/scripts/run-config.sh flags "$CONFIG")" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-wolfssl
        with:
          ref: ${{ matrix.wolfssl-ref }}
          configure-flags: ${{ steps.flags.outputs.flags }}
          prefix: /tmp/wolfssl-install

      - uses: ./.github/actions/setup-go-wolfssl

      - name: Test go-wolfssl
        env:
          CONFIG: ${{ matrix.config }}
        run: .github/scripts/run-config.sh test "$CONFIG" /tmp/wolfssl-install

  fips-ready:
    name: fips-ready (wolfSSL ${{ matrix.version }} FIPS Ready)
    if: github.repository_owner == 'wolfssl'
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/wolfssl/go-wolfssl-ci@sha256:243df6018d71ed9b47be8cb4c0472b1ad626b5fe583683686c72134115225003
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: 5.9.4
            sha256: f1dc8081a41c8cbb02fd6c67edff9d79e35038d647b6290b1e2ff7d9f81ac647
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: wolfSSL configure flags
        id: flags
        run: echo "flags=$(.github/scripts/run-config.sh flags fips-ready)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-wolfssl
        with:
          fips-ready-version: ${{ matrix.version }}
          fips-ready-sha256: ${{ matrix.sha256 }}
          configure-flags: ${{ steps.flags.outputs.flags }}
          prefix: /tmp/wolfssl-install

      - uses: ./.github/actions/setup-go-wolfssl

      - name: Test go-wolfssl
        run: .github/scripts/run-config.sh test fips-ready /tmp/wolfssl-install
