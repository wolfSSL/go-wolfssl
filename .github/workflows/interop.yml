name: OpenSSL Interop
run-name: ${{ inputs.nightly_id && format('Nightly {0}', inputs.nightly_id) || github.event.pull_request.title || github.event.head_commit.message || github.workflow }}

# START OF COMMON SECTION
on:
  workflow_call:
  push:
    branches: [ 'master', 'main', 'release/**' ]
  pull_request:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      nightly_id:
        description: Set by the nightly dispatcher to identify its runs
        type: string
        default: ''

# END OF COMMON SECTION

permissions:
  contents: read

defaults:
  run:
    shell: bash -e {0}

jobs:
  discover:
    if: github.repository_owner == 'wolfssl'
    uses: ./.github/workflows/_resolve-wolfssl.yml

  openssl:
    name: Examples vs OpenSSL (wolfSSL ${{ matrix.wolfssl-ref }})
    needs: discover
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/wolfssl/go-wolfssl-ci@sha256:243df6018d71ed9b47be8cb4c0472b1ad626b5fe583683686c72134115225003
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        wolfssl-ref: ${{ fromJson(needs.discover.outputs.refs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: wolfSSL configure flags
        id: flags
        run: echo "flags=$(.github/scripts/run-config.sh flags all)" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-wolfssl
        with:
          ref: ${{ matrix.wolfssl-ref }}
          configure-flags: ${{ steps.flags.outputs.flags }}
          prefix: /tmp/wolfssl-install

      - uses: ./.github/actions/setup-go-wolfssl

      - name: Example client and server against OpenSSL
        run: .github/scripts/openssl-interop.sh /tmp/wolfssl-install
