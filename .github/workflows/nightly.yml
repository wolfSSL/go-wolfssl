name: Nightly CI

# Dispatches the workflows listed below on the default branch, waits for them,
# and keeps one tracking issue: opened (or commented) when a run fails, closed
# once a later nightly passes in full, which also clears flaky failures.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nightly:
    name: Run and report nightly CI
    if: github.repository == 'wolfSSL/go-wolfssl'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Dispatch, wait, and update the tracking issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const LABEL = 'nightly-failure';
            const POLL_MS = 60 * 1000;
            const TIMEOUT_MS = 210 * 60 * 1000;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            const { owner, repo } = context.repo;
            const ref = context.payload.repository?.default_branch || 'master';

            // Each child names its run "Nightly <id>", so only this nightly's
            // runs are collected even if someone dispatches one by hand.
            const id = String(context.runId);
            const title = `Nightly ${id}`;
            const workflows = {
              'config-matrix.yml': {},
              'go-versions.yml': {},
              'static-analysis.yml': {},
              'codeql.yml': {},
              'multi-compiler.yml': {},
              'sanitizer.yml': { nightly: 'true' },
              'fuzz.yml': { fuzztime: '10m' },
              'interop.yml': {},
            };
            const names = Object.keys(workflows);

            // A minute of margin so clock skew cannot hide the dispatched runs.
            const since = new Date(Date.now() - 60 * 1000).toISOString();
            const notDispatched = new Set();
            for (const [workflow_id, inputs] of Object.entries(workflows)) {
              try {
                await github.rest.actions.createWorkflowDispatch({
                  owner, repo, workflow_id, ref, inputs: { ...inputs, nightly_id: id },
                });
                core.info(`Dispatched ${workflow_id}`);
              } catch (error) {
                notDispatched.add(workflow_id);
                core.warning(`Could not dispatch ${workflow_id}: ${error.message}`);
              }
            }
            const waitFor = names.filter((n) => !notDispatched.has(n));

            const basename = (p) => (p || '').split('/').pop();
            async function latestRuns() {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, event: 'workflow_dispatch', created: `>=${since}`, per_page: 100,
              });
              const latest = new Map();
              for (const run of runs) {
                const file = basename(run.path);
                if (!names.includes(file) || run.display_title !== title) continue;
                const prev = latest.get(file);
                if (!prev || run.run_number > prev.run_number) latest.set(file, run);
              }
              return latest;
            }

            await sleep(30 * 1000);
            const deadline = Date.now() + TIMEOUT_MS;
            let latest = new Map();
            for (;;) {
              latest = await latestRuns();
              const pending = [...latest.values()].filter((r) => r.status !== 'completed');
              core.info(`${latest.size}/${waitFor.length} runs found, ${pending.length} still running`);
              if (latest.size === waitFor.length && pending.length === 0) break;
              if (Date.now() >= deadline) {
                core.warning('Timed out waiting for the nightly runs');
                break;
              }
              await sleep(POLL_MS);
            }

            const results = names.map((name) => {
              const run = latest.get(name);
              const state = notDispatched.has(name) ? 'dispatch failed'
                : !run ? 'not found' : run.status !== 'completed' ? 'still running' : run.conclusion;
              return { name, run, state };
            });
            const failed = results.filter((r) => r.state !== 'success');

            let table = '| Workflow | Result | Run |\n|---|---|---|\n';
            for (const r of results) {
              table += `| ${r.name} | ${r.state} | ${r.run ? `[#${r.run.run_number}](${r.run.html_url})` : '-'} |\n`;
            }
            await core.summary.addRaw(`## Nightly CI\n\n${table}`).write();

            const today = since.slice(0, 10);
            const nightlyUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const open = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: LABEL, per_page: 1,
            })).data[0];

            if (failed.length === 0) {
              if (open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: open.number,
                  body: `Nightly CI passed in full on ${today} ([nightly run](${nightlyUrl})), so the failures above did not reproduce. Closing.\n\n${table}`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed',
                });
                core.info(`Closed #${open.number}`);
              }
              core.info('All nightly workflows passed');
              return;
            }

            const body = `Nightly CI on ${today} had ${failed.length} workflow(s) not passing ([nightly run](${nightlyUrl})).\n\n${table}`;
            await github.rest.issues.createLabel({
              owner, repo, name: LABEL, color: 'b60205', description: 'Automated nightly CI failure report',
            }).catch(() => {});
            if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body });
              core.info(`Commented on #${open.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title: `Nightly CI failures (${today})`, body, labels: [LABEL],
              });
              core.info(`Opened #${created.data.number}`);
            }
            core.setFailed(`${failed.length} nightly workflow(s) did not pass`);
